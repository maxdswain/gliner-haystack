name: Publish Docker image

on:
  push:
    branches: [main]
    # Only image inputs or this workflow need to trigger a rebuild.
    paths:
      - Dockerfile
      - .dockerignore
      - .gitmodules
      - vendor/vllm-factory-fstn
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vllm-gliner:latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VLLM_BASE_IMAGE=vllm/vllm-openai-cpu:v0.20.0-x86_64
          tags: ghcr.io/${{ github.repository_owner }}/vllm-gliner:latest-cpu
