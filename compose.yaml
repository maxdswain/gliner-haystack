services:
  gliner:
    build: .
    image: gliner-vllm-factory:local
    ports:
      - "8000:8000"
    gpus: all
    shm_size: 1gb
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      MODEL_ID: ${MODEL_ID:-fastino/gliner2.5-multi-v1}
      MODEL_PLUGIN: ${MODEL_PLUGIN:-deberta_gliner25}
      IO_PLUGIN: ${IO_PLUGIN:-deberta_gliner25_io}
      DTYPE: ${DTYPE:-bfloat16}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        vllm-factory-prep --model "$$MODEL_ID" --plugin "$$MODEL_PLUGIN" --output /models/current --force
        exec vllm serve /models/current \
          --host 0.0.0.0 --port 8000 \
          --runner pooling --trust-remote-code --dtype "$$DTYPE" \
          --no-enable-prefix-caching --no-enable-chunked-prefill \
          --io-processor-plugin "$$IO_PLUGIN"

volumes:
  huggingface-cache:
